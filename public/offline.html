<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Plata</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(40rem 30rem at 10% -10%, #0d2a24 0%, transparent 55%),
          radial-gradient(36rem 26rem at 100% 0%, #101b33 0%, transparent 50%),
          #070b10;
        color: #e8eef6;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: #34d399;
        color: #04231b;
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 900;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: #8ba0b4;
      }
      a {
        display: inline-block;
        border-radius: 12px;
        background: #34d399;
        color: #04231b;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">P</div>
      <h1>Sin conexión</h1>
      <p>
        Plata necesita internet para leer y guardar tus movimientos. Cuando vuelva
        la señal, tus datos van a estar ahí.
      </p>
      <a href="/">Volver a intentar</a>
    </main>
  </body>
</html>
