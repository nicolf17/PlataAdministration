# Cambiá "app" si el nombre ya está tomado en Fly.io.
app = "plata-finanzas"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  DATABASE_URL = "file:/data/plata.db"
  SESSION_SECRET = "plata-dev-secret-change-me"

[http_service]
  internal_port = 3000
  force_https = true
  # Una sola máquina + volumen persistente. SQLite no escala horizontalmente.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "plata_data"
  destination = "/data"
  initial_size = "1gb"
